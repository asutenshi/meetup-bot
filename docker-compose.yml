# Ротация логов контейнеров штатными средствами Docker (TZ §6.2): держим
# несколько файлов ограниченного размера, чтобы JSON-логи не забили диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # Тот же образ, режим worker (TZ §3.1): APScheduler-проход напоминаний
  # раз в WORKER_POLL_INTERVAL_MINUTES. Отдельный контейнер, чтобы падение
  # долгого cron-цикла не роняло приём апдейтов ботом, и наоборот.
  worker:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    command: ["meetup-bot-worker"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
